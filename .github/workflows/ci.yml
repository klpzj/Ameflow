name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 语法检查
        run: npm run check

      - name: 构建
        run: npm run build

      - name: 校验 edge-ext 与 src 同步
        run: git diff --exit-code -- edge-ext
